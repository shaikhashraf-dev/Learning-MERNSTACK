<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learning Box Model</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
    }
   #my_box {
    background-color: blueviolet;
    height: 50px;
    width: 50px;
    padding: 5px;
    margin: 40px 20px;
    text-align: center;
    border: 4px solid rgb(79, 51, 51);
    border-radius: 15px;
}

#my_button {
    height: 23px;
    padding: 2px;
    margin: 10px;
    border: 1px solid;
    border-radius: 18px;
    background-color: #272424;
    color: white;
}
</style>
<body>
   <div id="my_box">My Box</div>
   <button id="my_button">Subscribe</button>
</body>
</html>
