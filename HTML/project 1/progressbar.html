<!DOCTYPE html>
<html lang="en">
<head>
    <title>Loading Bar</title>
</head>
<style>
    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container{
      width: 300px;
      height: 30px;
      background-color: lightgray;
      border-radius: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    
    }
    .bar{
        height: 100%;
        width:50%;
        background-color: green;
        border-radius: 20px;
        animation: load 4s infinite forwards;
    }

    @keyframes load {
        0%{
    width:0%;
        }
        90%{
            width:103%;
        }
        100%{
   width:100%;
        }
        
    }
</style>
<body>
    <div class="container">
        <div class="bar"></div>
    </div>

    
</body>
</html>
