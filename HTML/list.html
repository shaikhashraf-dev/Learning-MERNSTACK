<!DOCTYPE html>
<html lang="en">
<head>
    <title>List tags</title>
   
</head>
<body>
    <h2 style="text-align: center;">This page will contain all the lists</h2>
    <hr>
 <h3>All the Backend programming language:-</h3>
    <ol>
     <li>C language</li>
     <li>C++ Language</li>
     <li>Python</li>
     <li>PHP</li>
</ol>
<h3>All the Front-end language</h3>
<ol type="A">
 <li>HTML</li>
 <li>CSS</li>
 <li>Javascript</li>
</ol>


<h3>all the names</h3>
<ol type="I">
<li>Ashaf</li>
<li>Rehan</li>
<li>Salman</li>
</ol>
<hr>
<h3>Unordered list:-</h3>
<ul>
<li>Mango</li>
<li>Apple</li>
<li>cherry</li>
</ul>   
</body>
</html>
