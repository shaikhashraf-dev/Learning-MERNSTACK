<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display</title>
    <style>
        *{
            margin:0px;
            padding:0px;
        }
 .box {
    font-size:25px;
    background-color: blueviolet;
    height: 100px;
    width: 100px;
    margin:10px;
    padding: 10px;
    box-sizing: border-box;
    border:3px solid black;
    border-radius: 18px;
    text-align:center;
 }
 #box1 {
    position:static;
 }
 #box2 {
    position:relative;
    top: 10px;
    
    left:130px;
    z-index: 1;
    
 }

 #box3 {
    position:absolute;
    top: 120px;
    left: 130px;
 }
 #box4 {
    position: fixed;
 }
    </style>
</head>
<body>
    <div class="box" id="box1">Box 1</div>
    <div class="box" id="box2">Box 2</div>
    <div class="box" id="box3">Box 3</div>
    <div class="box" id="box4">Box 4</div>
</body>
</html>
