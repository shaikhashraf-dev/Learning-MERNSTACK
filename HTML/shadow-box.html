<!DOCTYPE html>
<html lang="en">
<head>
    <title>Shadow-Box</title>
    <style>
        html {
            --main-color:rgba(007, 334, 221, 1);
        }
   *{
    padding:0px;
    margin: 0px;
    box-sizing: border-box;
   }

   .box{
    background-color: var(--main-color);
    height: 150px;
    width: 170px;
    padding: 25px;
    margin: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    border: 2px solid black;
    box-shadow: 20px 10px 05px var(--main-color);
   }

    </style>
</head>
<body>
    <div class="box">Box 1</div>
    
</body>
</html>
