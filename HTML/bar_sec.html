<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bar Section</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: content-box;
            font-family: 'Times New Roman', Times, serif;
        }
       .sec {
        width: 100%;
        min-height: 10vh;
        background-color: aliceblue;
        display: flex;
        justify-content: space-around;
        align-items: center;
       
         }
       li {
        list-style: none;
        

       }
      ul li a{
        text-decoration: none;
        color: black;
        margin:30px;
        font-size: 20px;
       
       }
  li a:hover {
       color: rgba(1, 10, 10, 0.427);
  }
    </style>
</head>
<body>
    <div class="bar">
        <div class="sec">
            <ul>
                <li>
                    <a href="#home">Home</a>
                    <a href="#About">About</a>
                    <a href="#Help">Help</a>
                    <a href="#Contact">Contact Us</a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
