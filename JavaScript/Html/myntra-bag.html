<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Bag</title>
    <style>
        .my_button{
            background-color:antiquewhite;
        }
        .bag{
          border-radius: 10px;
          padding: 3px 20px;
          background-color: #90ec8d;
          border: 1px;
          cursor: pointer;
        }
        #heart{
     text-transform: uppercase; 
     padding: 3px 35px;
     border: 2px solid black;
     border-radius: 10px;
     cursor: pointer;
        }
    </style>
   <script src="first1.js"></script>
    <script>
        let  ItemsInBag = 0;
      document.getElementById("bag").innerHTML  = 'Your Bag has 0 items';
    </script>
      
<body>
    <main>
       <button class="bag" onclick="
       ItemsInBag ++;
        document.getElementById('bag').innerHTML = 'Your Bag has '+  ItemsInBag +' items';
           " class="bag">Add to Bag</button>

      <button onclick="
       ItemsInBag --;
        document.getElementById('bag').innerHTML = 'Your Bag has '+  ItemsInBag +' items';
           "  id="heart">❤️ wishlist</button>

       <button onclick="
       ItemsInBag += 2;
        document.getElementById('bag').innerHTML = 'Your Bag has '+  ItemsInBag +' items';
           " class="bag">Add 1+1 sale item</button>

       <h1 id="bag">Your Bag has 0 items</h1> 
       
      
     
      </main>
</body>
</html>
